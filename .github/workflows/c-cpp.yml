name: C/C++ CI

on:
  push:
    branches: 
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: setup
        run: |
          sudo apt-get update
          sudo apt-get install curl python3 python3-dev python3-pip gcc-arm-none-eabi cmake clang git mercurial ninja-build
          python3 -m pip install mbed-tools
      - name: compile
        run: |
          mbed-tools deploy
          mbed-tools configure -m NUCLEO_F446RE -t GCC_ARM
          mbed-tools compile -m NUCLEO_F446RE -t GCC_ARM
