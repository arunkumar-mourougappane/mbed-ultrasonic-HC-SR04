name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: setup
        run: |
          sudo apt-get update
          sudo apt-get install python3 python3-dev python3-pip gcc-arm-none-eabi cmake clang git mercurial ninja-build
          python -m pip install mbed-tools --pre
      - name: compile
        run: |
          mbed-tools deploy
          mbed-tools configure -m NUCLEO_F303RE
          mbed-tools configure -t GCC_ARM
          mbed-tools compile -m NUCLEO_F303RE -t GCC_ARM --clean
          mbed-tools compile -m NUCLEO_F303RE -t GCC_ARM
